name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Test, build & publish to npm (Node 24)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile --registry https://registry.npmjs.org

      - name: Lint
        run: yarn lint

      - name: Check format
        run: yarn format:check

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

      - name: Publish to npm (trusted publishing / OIDC)
        run: |
          IS_PRERELEASE=$(node -p "require('semver').prerelease(require('./package.json').version) !== null")
          if [ "$IS_PRERELEASE" = "true" ]; then
            npm publish --access public --provenance --tag beta --registry https://registry.npmjs.org
          else
            npm publish --access public --provenance --registry https://registry.npmjs.org
          fi
