language: node_js

os:
  - linux

dist: jammy

node_js:
  - '24'

install:
  - npm install --registry https://registry.npmjs.org
  - npm install -g codecov --registry https://registry.npmjs.org

stages:
  - test
  - name: releaseNpm
    if: branch = master

jobs:
  include:
    - stage: test
      name: 'Run test scripts'
      script:
        - npm run test
        - codecov

    - stage: releaseNpm
      name: 'Release npm package'
      script:
        - echo "Release npm package..."
        - npm run build
      deploy:
        provider: npm
        email: 1558267774@qq.com
        api_token: '$NPM_TOKEN'
        skip_cleanup: true
        on:
          branch: master

notifications:
  email: false
